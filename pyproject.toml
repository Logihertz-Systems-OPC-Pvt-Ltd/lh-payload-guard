[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-payload-guard"
version = "0.1.0"
description = "Inspects captured HTTP request bodies, query strings, headers, and webhook payloads using multi-pass de-obfuscation to detect SQL injection (SQLi), XSS, Server-Side Template Injection (SSTI), XXE, and command injection."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "payload-inspection",
    "sqli-detection",
    "xss-detection",
    "waf-testing",
    "appsec",
    "sarif",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-payload-guard"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-payload-guard"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-payload-guard#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-payload-guard/issues"

[project.scripts]
lh-payload = "lh_payload_guard.cli:app"
lh-payload-guard = "lh_payload_guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_payload_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

